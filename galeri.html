<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri Logo Kampus</title>
  <link rel="stylesheet" href="galeri.css">
</head>
<body>
  <h2>Galeri Logo Club Bola</h2>
  <div class="galeri">
    <figure>
      <img src="Real_Madrid_CF.svg" alt="Logo Real Madrid">
      <figcaption>Real Madrid CF</figcaption>
    </figure>
    <figure>
      <img src="Chelsea_FC.svg" alt="Logo Chelsea FC">
      <figcaption>Chelsea FC</figcaption>
    </figure>
    <figure>
      <img src="arsenal.png" alt="Logo Arsenal">
      <figcaption>Arsenal FC</figcaption>
    </figure>
    <figure>
      <img src="juventus.jpg" alt="Logo Juventus">
      <figcaption>Juventus FC</figcaption>
    </figure>
    <figure>
      <img src="manchester_united.png" alt="Logo Manchester United">
      <figcaption>Manchester United FC</figcaption>
    </figure>
    <figure>
      <img src="barcelona.png" alt="Logo FC Barcelona">
      <figcaption>FC Barcelona</figcaption>
    </figure>
  </div>
</body>
</html>
